name: build

# 目的は2つ。
#  1. ホスト側テストとファームのビルドが壊れていないことを常に確認する
#  2. **ESP-IDF を入れていない人がそのまま書き込めるバイナリ**を配る
#     （docs/PREBUILT_BINARIES.md）
#
# ⚠ 配布バイナリは boards/*.h のピン定義を焼き込んだものです。
#   M5StampS3A の SPI4本・RST・IRQ は実機確認済みだが、WAKEUP と StampFly 用の
#   定義は未検証の暫定値。配線が docs/PREBUILT_BINARIES.md と違えば動きません。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  IDF_VERSION: v5.5.2

jobs:
  # ---------------------------------------------------------------- #
  # ホスト側テスト（ESP-IDF 不要。実機も不要）
  # ---------------------------------------------------------------- #
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tests/host/*/Makefile を自動検出して test → strict → float を回す
      # （tests/Makefile）。新しいサブディレクトリが増えてもここは変更不要。
      # ESP-IDF ビルドとは警告設定が違うので、ホスト側も -Werror（strict）で
      # 別途通す（docs/HANDOFF.md「落とし穴」3）。
      - name: host tests (tests/host/*)
        run: make -C tests test strict float

      # 文書とコードの整合チェック。同じ表を複数の文書に置いた結果、訂正が
      # 片方だけに入って食い違う事故（docs/HANDOFF.md の D-2）を機械的に防ぐ。
      # リンク切れ・削除済み文書への参照・パッド↔FPC 対応表の重複・
      # Kconfig シンボルの実在・配線表と boards/*.h の一致を見る。
      - name: docs consistency (tools/docs_check)
        run: |
          pip install --quiet pyyaml
          python3 tools/docs_check/verify_docs.py

  # ---------------------------------------------------------------- #
  # ファームウェアのビルド → 書き込み可能なバイナリを artifact に
  # ---------------------------------------------------------------- #
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # anchor/tag（*-ds）の既定は「遅延プリセット PollingBoth（約31Hz）＋ IRQ 有効」。
          # BothIrq（約90Hz）は実機での素の成功率が低く 2026-08-30 に本番既定から外した
          # （docs/HANDOFF.md §0-D「6.8 Mbps の切り分けと本番既定の決定」）。IRQ の極性・
          # 動作は 2026-08-29〜30 に実機確認済み（docs/IRQ_POLICY.md）。*-polling は
          # IRQ が個体によっては未配線・不調な場合の切り分け用で、UWB_ENABLE_IRQ=n
          # だけを追加する（遅延プリセットは PollingBoth のまま変えない）。
          # firmware/twr（twr-tag-*/twr-anchor-*）だけは今も BothIrq が既定。

          # --- 実験1: SPI 疎通確認（遅延プリセットは無関係） ---
          - name: probe-stamps3
            app: probe
            kconfig: |
              CONFIG_UWB_PROBE_BOARD_STAMPS3=y
          - name: probe-stampfly
            app: probe
            kconfig: |
              CONFIG_UWB_PROBE_BOARD_STAMPFLY=y

          # --- 実験2/3: 1対1の測距 ---
          - name: twr-tag-ss
            app: twr
            kconfig: |
              CONFIG_UWB_TWR_BOARD_STAMPS3=y
              CONFIG_UWB_TWR_ROLE_TAG=y
              CONFIG_UWB_TWR_METHOD_SS=y
          - name: twr-anchor-ss
            app: twr
            kconfig: |
              CONFIG_UWB_TWR_BOARD_STAMPS3=y
              CONFIG_UWB_TWR_ROLE_ANCHOR=y
              CONFIG_UWB_TWR_METHOD_SS=y
          - name: twr-tag-ds
            app: twr
            kconfig: |
              CONFIG_UWB_TWR_BOARD_STAMPS3=y
              CONFIG_UWB_TWR_ROLE_TAG=y
              CONFIG_UWB_TWR_METHOD_DS=y
          - name: twr-anchor-ds
            app: twr
            kconfig: |
              CONFIG_UWB_TWR_BOARD_STAMPS3=y
              CONFIG_UWB_TWR_ROLE_ANCHOR=y
              CONFIG_UWB_TWR_METHOD_DS=y

          # --- 実験5/6: 本番。アドレスと座標は実行時にコンソールで設定するので
          #     **5台とも同じバイナリでよい** ---
          - name: anchor-stamps3-ds
            app: anchor
            kconfig: |
              CONFIG_UWB_ANCHOR_BOARD_STAMPS3=y
              CONFIG_UWB_ANCHOR_METHOD_DS=y
          - name: tag-stamps3-ds
            app: tag
            kconfig: |
              CONFIG_UWB_TAG_BOARD_STAMPS3=y
              CONFIG_UWB_TAG_METHOD_DS=y
          - name: tag-stampfly-ds
            app: tag
            kconfig: |
              CONFIG_UWB_TAG_BOARD_STAMPFLY=y
              CONFIG_UWB_TAG_METHOD_DS=y

          # --- フォールバック: IRQ が実機で期待どおり動かなかった場合に使う。
          #     **polling 版は対向側も必ず polling 版とセットで使うこと**
          #     （遅延プリセットが片側だけ違うと測距が成立しない）。tag 側は
          #     stamps3 / stampfly の両方を用意し、どちらも
          #     anchor-stamps3-ds-polling と組んで使う ---
          - name: anchor-stamps3-ds-polling
            app: anchor
            kconfig: |
              CONFIG_UWB_ANCHOR_BOARD_STAMPS3=y
              CONFIG_UWB_ANCHOR_METHOD_DS=y
              CONFIG_UWB_ENABLE_IRQ=n
              CONFIG_UWB_TIMING_PROFILE_POLLING_BOTH=y
          - name: tag-stamps3-ds-polling
            app: tag
            kconfig: |
              CONFIG_UWB_TAG_BOARD_STAMPS3=y
              CONFIG_UWB_TAG_METHOD_DS=y
              CONFIG_UWB_ENABLE_IRQ=n
              CONFIG_UWB_TIMING_PROFILE_POLLING_BOTH=y
          - name: tag-stampfly-ds-polling
            app: tag
            kconfig: |
              CONFIG_UWB_TAG_BOARD_STAMPFLY=y
              CONFIG_UWB_TAG_METHOD_DS=y
              CONFIG_UWB_ENABLE_IRQ=n
              CONFIG_UWB_TIMING_PROFILE_POLLING_BOTH=y

    steps:
      - uses: actions/checkout@v4

      # matrix の値をスクリプト本文に直接展開すると、YAML のインデントが
      # そのまま混入して Kconfig が読めなくなる。env 経由で渡し、行頭の
      # 空白を落としてから書き出す。
      - name: Write CI sdkconfig fragment
        env:
          KCONFIG: ${{ matrix.kconfig }}
        run: |
          set -eu
          printf '%s\n' "$KCONFIG" | sed 's/^[[:space:]]*//' \
            > "firmware/${{ matrix.app }}/ci.defaults"
          echo "--- firmware/${{ matrix.app }}/ci.defaults ---"
          cat -A "firmware/${{ matrix.app }}/ci.defaults" | head -20

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: firmware/${{ matrix.app }}
          command: >-
            idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;ci.defaults" build
            && idf.py merge-bin -o merged-firmware.bin

      - name: Collect artifacts
        env:
          APP: ${{ matrix.app }}
        run: |
          set -eu
          out="dist/${{ matrix.name }}"
          mkdir -p "$out"
          b="firmware/${{ matrix.app }}/build"
          cp "$b/merged-firmware.bin" "$out/"
          cp "$b"/*.bin               "$out/" || true
          # flasher_args.json は bootloader/ と partition_table/ の下を
          # 相対パスで参照する。同梱しないと「個別に書き込む」経路が
          # 壊れるので、ディレクトリ構造ごとコピーする。
          cp "$b/flasher_args.json" "$out/"
          mkdir -p "$out/bootloader" "$out/partition_table"
          cp "$b/bootloader/bootloader.bin"           "$out/bootloader/"
          cp "$b/partition_table/partition-table.bin" "$out/partition_table/"
          cp firmware/${{ matrix.app }}/ci.defaults "$out/kconfig-used.txt"
          # ライセンス同梱: components/qm33120w_sdk/ の LicenseRef-QORVO-2 条件2
          # （バイナリ再配布時は著作権表示を配布物に含める）を zip 単体で満たす
          # ため、MIT 本体・サードパーティ一覧・Qorvo ライセンス全文を入れる。
          cp LICENSE                 "$out/"
          cp THIRD_PARTY_LICENSES.md "$out/"
          mkdir -p "$out/LICENSES"
          cp components/qm33120w_sdk/LICENSES/LicenseRef-QORVO-2.txt "$out/LICENSES/"
          {
            echo "# ${{ matrix.name }}"
            echo
            echo "app: firmware/${{ matrix.app }}"
            echo "commit: ${{ github.sha }}"
            echo
            echo 'この variant が何かは docs/PREBUILT_BINARIES.md の「どれを取ればいいか」を、'
            echo '書き込み後のアドレス設定・座標入力・Wi-Fi設定・ダッシュボード表示までの'
            echo '手順は同ファイルの「一気通貫の手順」を参照。詳細は docs/GETTING_STARTED.md §6/§7。'
            echo
            echo '## 書き込み方（ESP-IDF は不要）'
            echo
            echo '```sh'
            echo 'pip install esptool'
            echo 'esptool.py --chip esp32s3 -p /dev/cu.usbmodemXXXX write_flash 0x0 merged-firmware.bin'
            echo '```'
            echo
            echo '書き込み後は 115200bps のシリアルターミナルでログとコンソールを見られる'
            echo '（`idf.py monitor` は ESP-IDF が無いと使えない。macOS/Linuxは'
            echo '`screen /dev/cu.usbmodemXXXX 115200`、Windowsは Tera Term や PuTTY 等）。'
            echo
            echo 'ブラウザから書き込む場合は https://espressif.github.io/esptool-js/ で'
            echo 'merged-firmware.bin をオフセット 0x0 に指定する（Chrome/Edge が必要）。'
            echo
            echo '個別に書き込みたい場合は同梱の flasher_args.json が使える:'
            echo
            echo '```sh'
            echo 'esptool.py --chip esp32s3 -p /dev/cu.usbmodemXXXX write_flash @flasher_args.json'
            echo '```'
            echo
            echo '## 適用した設定'
            echo
            echo '```'
            cat firmware/${{ matrix.app }}/ci.defaults
            echo '```'
            echo
            if [ "$APP" = anchor ] || [ "$APP" = tag ]; then
              echo '上記に CONFIG_UWB_ENABLE_IRQ=n が無ければ、既定どおり IRQ 有効＋遅延'
              echo 'プリセット PollingBoth（約31Hz）で焼かれている。この組み合わせは実機で'
              echo '確認済み（2026-08-29〜30。docs/IRQ_POLICY.md）。CONFIG_UWB_ENABLE_IRQ=n が'
              echo 'あれば IRQ を明示的に無効化した -polling 版（遅延プリセットは変わらず'
              echo 'PollingBoth のまま）。'
              echo
            elif [ "$APP" = twr ]; then
              echo '`firmware/twr` は 1対1 診断用ファームで、既定の遅延プリセットは'
              echo '`BothIrq`（約90Hz、上記に CONFIG_UWB_TIMING_PROFILE_* が無ければ既定のまま）。'
              echo 'anchor/tag の本番既定（PollingBoth）とは異なるので注意すること'
              echo '（docs/PREBUILT_BINARIES.md 参照）。'
              echo
            fi
            echo '## 注意'
            echo
            echo '**ピン定義 (boards/*.h) のうち、M5StampS3A の SPI4本・RST・IRQ は実機確認済み'
            echo 'だが、WAKEUP と StampFly 用の定義は未検証の暫定値**です。配線がドキュメントと'
            echo '違う場合、このバイナリは動きません。詳細は docs/PREBUILT_BINARIES.md を読むこと。'
            echo
            echo '## ライセンス'
            echo
            echo '本リポジトリのコード（`components/uwb_port/` など）は MIT ライセンスです'
            echo '（同梱の `LICENSE`）。このバイナリには Qorvo QM33120W/DW3720 用ドライバ'
            echo '（`LicenseRef-QORVO-2`。全文は同梱の `LICENSES/LicenseRef-QORVO-2.txt`）と、'
            echo 'M5Stack Technology CO LTD 由来の MIT ライセンスコード（`components/uwb_qm33120/`）'
            echo 'が組み込まれています。'
            echo
            echo '**`LicenseRef-QORVO-2` 条件3により、このバイナリは Qorvo 製 IC'
            echo '（本モジュール = M5Stamp UWB Module に搭載された QM33120W/DW3720）と'
            echo '共に使う場合に限り利用が許可されています。他ベンダーのチップへ'
            echo '転用することはできません。**'
            echo
            echo '詳細は同梱の `THIRD_PARTY_LICENSES.md` を参照してください。'
          } > "$out/README.md"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          retention-days: 90

  # ---------------------------------------------------------------- #
  # タグを打ったときだけ、Release にバイナリを添付する
  # ---------------------------------------------------------------- #
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # Release に添付するのは「普通に測位する」「配線確認する」の2本だけに
      # 絞る（2026-09-05 ユーザー判断）。他の variant（StampFly・polling・
      # twr 診断）は開発者向けとして Actions の artifact のみに残す
      # （12 通り全部が引き続きビルド・artifact 化はされる。上の firmware job
      # 参照）。各 variant は bundle の中のサブフォルダとして残す
      # （README.md・merged-firmware.bin 等はそのまま）。
      - name: Pack bundles
        run: |
          set -eu
          mkdir -p release
          root="$PWD"

          # dist/<variant> が無ければ即失敗させる。matrix の variant 名を
          # rename/削除したときに、bundle から静かに抜け落ちるのを防ぐため。
          stage_variant() {
            # $1: stage dir  $2: variant 名
            if [ ! -d "dist/$2" ]; then
              echo "ERROR: dist/$2 が見つかりません（matrix の variant 名が変わった/削除された可能性があります）" >&2
              exit 1
            fi
            cp -r "dist/$2" "$1/$2"
          }

          # ---- 1: 普通に測位したい（M5StampS3A のタグ + アンカー、IRQ 有効） ----
          b1="$(mktemp -d)"
          stage_variant "$b1" tag-stamps3-ds
          stage_variant "$b1" anchor-stamps3-ds
          {
            echo '# 1-positioning-M5StampS3A-tag-and-anchor'
            echo
            echo '普通に測位する場合のバンドルです（タグ1台 + アンカー数台、全て'
            echo 'M5StampS3A + StampS3 BreakOut の標準構成。IRQ 有効 + 遅延プリセット'
            echo '`PollingBoth`、実機確認済みの既定設定）。'
            echo
            echo '## どのフォルダをどの機器に書き込むか'
            echo
            echo '- タグ 1 台 → `tag-stamps3-ds/merged-firmware.bin`'
            echo '- アンカー全台 → `anchor-stamps3-ds/merged-firmware.bin`（全台同じ内容でよい）'
            echo
            echo '## 書き込み方（ESP-IDF は不要）'
            echo
            echo '```sh'
            echo 'esptool.py --chip esp32s3 -p <port> write_flash 0x0 merged-firmware.bin'
            echo '```'
            echo
            echo '各サブフォルダの詳しい説明・ライセンスはサブフォルダ内の README.md を参照してください。'
            echo
            echo '書き込んだ後にアドレス設定・座標登録・Wi-Fi設定・ダッシュボード表示まで行う'
            echo '手順の全体は docs/PREBUILT_BINARIES.md の「一気通貫の手順」を参照してください。'
          } > "$b1/README.md"
          (cd "$b1" && zip -qr "$root/release/1-positioning-M5StampS3A-tag-and-anchor.zip" .)

          # ---- 2: 配線後にUWBモジュールと通信できるか確認する ----
          b2="$(mktemp -d)"
          stage_variant "$b2" probe-stamps3
          {
            echo '# 2-wiring-check-probe-M5StampS3A'
            echo
            echo '配線した後、UWB モジュールと通信できるかを確かめるファームです'
            echo '（M5StampS3A 用。測位の前に必ずこれで確認してください）。'
            echo
            echo '## どのフォルダをどの機器に書き込むか'
            echo
            echo '- 疎通確認したい M5StampS3A → `probe-stamps3/merged-firmware.bin`'
            echo
            echo '## 書き込み方（ESP-IDF は不要）'
            echo
            echo '```sh'
            echo 'esptool.py --chip esp32s3 -p <port> write_flash 0x0 merged-firmware.bin'
            echo '```'
            echo
            echo '書き込んで 115200bps のシリアル端末を開くと、起動直後に Device ID'
            echo '`0xDECA0314` の読み出し（L1/L2）と拡張検査 L3〜L11 の結果が'
            echo 'PASS/FAIL/SKIP で表示され、`PROBE SUMMARY` 行にまとめて出ます。'
            echo 'その後は 1 秒周期で L1 の読み出しを繰り返します。'
            echo
            echo 'L1・L2 が PASS し、`0xDECA0314` が安定して読めていれば合格です。'
            echo '合格したら `1-positioning-M5StampS3A-tag-and-anchor.zip` を書き込んで'
            echo '測位に進んでください。'
            echo
            echo '各サブフォルダの詳しい説明・ライセンスはサブフォルダ内の README.md を参照してください。'
            echo
            echo '詳細は docs/PREBUILT_BINARIES.md・docs/GETTING_STARTED.md §4 を参照してください。'
          } > "$b2/README.md"
          (cd "$b2" && zip -qr "$root/release/2-wiring-check-probe-M5StampS3A.zip" .)

          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          body: |
            ESP-IDF を入れずに書き込めるバイナリです。Release に添付しているのは
            次の2本だけです。まず下の表で自分のやりたいことを探してください。

            | 何をしたいか | 取る zip | 書き込むファイル |
            |---|---|---|
            | 普通に測位したい（M5StampS3A のタグ 1 台 + アンカー N 台） | `1-positioning-M5StampS3A-tag-and-anchor.zip` | タグ → `tag-stamps3-ds/merged-firmware.bin`、アンカー全台 → `anchor-stamps3-ds/merged-firmware.bin`（全台同じ） |
            | 配線した後に UWB モジュールと通信できるか確認したい | `2-wiring-check-probe-M5StampS3A.zip` | `probe-stamps3/merged-firmware.bin`（書き込んでシリアル端末を見る。合格したら上の行の zip へ進む） |

            zip を開くと variant 名のサブフォルダがあり、その中の
            `merged-firmware.bin` をオフセット `0x0` に書き込みます
            （サブフォルダごとに `README.md` も同梱）。

            他の variant（StampFly 用・ポーリング版・twr 診断）は Releases には
            載せません。必要な人は Actions の artifact から取ってください
            （開発者向け。`docs/PREBUILT_BINARIES.md` の「開発者向け」節参照）。

            ```sh
            esptool.py --chip esp32s3 -p /dev/cu.usbmodemXXXX write_flash 0x0 merged-firmware.bin
            ```

            **⚠ M5StampS3A の SPI4本・RST・IRQ のピン定義は実機確認済みですが、
            WAKEUP と StampFly 用の定義は未検証の暫定値です。** 配線が
            `docs/GETTING_STARTED.md` §3 と違う場合は動きません。
            書き込みから設定・ダッシュボード表示までの手順は `docs/PREBUILT_BINARIES.md`
            の「一気通貫の手順」を参照してください。

            **ライセンス**: 本リポジトリのコードは MIT です。各 zip には Qorvo
            QM33120W/DW3720 用ドライバ（`LicenseRef-QORVO-2`）が組み込まれており、
            **Qorvo 製 IC（M5Stamp UWB Module 搭載の QM33120W/DW3720）と共に使う
            場合に限り利用可能です。他ベンダーのチップへの転用はできません。**
            各サブフォルダに `LICENSE` / `THIRD_PARTY_LICENSES.md` /
            `LICENSES/LicenseRef-QORVO-2.txt` を同梱しています。詳細は
            `docs/PREBUILT_BINARIES.md` と `THIRD_PARTY_LICENSES.md`。
